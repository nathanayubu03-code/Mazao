<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KivuTrace & Market</title>
<meta name="description" content="Traçabilité café et cacao, ordres d'achat et paiements Mobile Money pour les producteurs du Nord-Kivu et du Sud-Kivu.">
<meta name="theme-color" content="#005F73">
<link rel="icon" href="/assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/app.css">
<script>try{var t=localStorage.getItem('kt.theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card stack">
    <div class="row" style="gap:14px">
      <img class="logo" src="/assets/logo-mark.png" alt="">
      <div><h1 style="font-size:1.3rem">KivuTrace &amp; Market</h1><p class="muted small">Traçabilité café et cacao, ordres d'achat, paiements Mobile Money</p></div>
    </div>
    <form class="card stack" id="loginForm" novalidate>
      <h2>Connexion</h2>
      <div><label class="lbl" for="login">Identifiant</label><input class="input" id="login" autocomplete="username" autocapitalize="none" required></div>
      <div><label class="lbl" for="password">Mot de passe</label><input class="input" id="password" type="password" autocomplete="current-password" required></div>
      <div class="err" id="err" role="alert"></div>
      <button class="btn primary block" type="submit" id="submit">Se connecter</button>
      <p class="tiny muted">Agents, acheteurs et coordination. Les administrateurs se connectent sur <a href="/admin">/admin</a>.</p>
    </form>
    <p class="tiny muted" style="text-align:center">Prototype de pilote. SMS, USSD et Mobile Money simulés.</p>
  </div>
</div>
<script type="module" src="/js/pages/home.js"></script>
</body>
</html>
